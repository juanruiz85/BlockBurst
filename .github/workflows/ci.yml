name: Integracion continua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sintaxis de los modulos
        run: node tools/check-syntax.js

      - name: Validacion de mapas
        run: node tools/validate-maps.js

      - name: Simulacion de partidas
        run: node tools/simulate.js
